server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Docker's embedded DNS. Without this, `fastcgi_pass app:9000` (a bare
    # hostname) resolves once when the worker starts and caches that IP for
    # the worker's entire lifetime — so redeploying `app` alone (new
    # container, new IP) leaves long-running nginx workers pointing at a
    # dead IP until nginx itself is restarted, surfacing as random 502s.
    # Using a variable in fastcgi_pass forces per-request resolution against
    # this resolver instead.
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 25M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
