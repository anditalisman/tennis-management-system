name: ztcms

x-backend-image: &backend-image
  build:
    context: ./backend
  volumes:
    - ./backend:/var/www/html
    - backend_vendor:/var/www/html/vendor
    - backend_storage:/var/www/html/storage
    - backend_bootstrap_cache:/var/www/html/bootstrap/cache
  networks: [ztcms]
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *backend-image
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 9000"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8090:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [ztcms]

  queue:
    <<: *backend-image
    command: php artisan queue:work --tries=3 --backoff=5 --sleep=3
    restart: unless-stopped

  scheduler:
    <<: *backend-image
    command: php artisan schedule:work
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ztcms}
      MYSQL_USER: ${DB_USERNAME:-ztcms}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ztcms}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "33017:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ztcms]

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [ztcms]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ztcms_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-secret}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [ztcms]

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8090/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:6666}
      # Server-side only (never sent to the browser): lets Next.js route
      # handlers reach the API over the docker network instead of round-
      # tripping through the host port. Keeps the Sanctum token off client JS
      # entirely — the browser only ever talks to same-origin /api/backend/*.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://nginx/api/v1}
    ports:
      - "6666:3000"
    depends_on:
      - nginx
    networks: [ztcms]

networks:
  ztcms:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  minio_data:
  backend_vendor:
  backend_storage:
  backend_bootstrap_cache:
  frontend_node_modules:
  frontend_next_cache:
