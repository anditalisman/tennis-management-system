name: ztcms

x-dns: &dns
  dns:
    - 10.10.222.101
    - 8.8.8.8

x-backend-image: &backend-image
  <<: *dns
  build:
    context: ./backend

  environment:
    TZ: ${TZ:-Asia/Makassar}
    APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Makassar}

    APP_NAME: ${APP_NAME:-Zul Tennis Clinic Management System}
    APP_ENV: ${APP_ENV:-production}
    APP_KEY: ${APP_KEY:?APP_KEY wajib diisi}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_URL: ${APP_URL:-https://zultennis.my.id}
    LOG_LEVEL: ${LOG_LEVEL:-warning}

    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: ${DB_DATABASE:-ztcms}
    DB_USERNAME: ${DB_USERNAME:-ztcms}
    DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}

    SESSION_DRIVER: redis
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis

    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:-null}

    FILESYSTEM_DISK: s3
    AWS_ENDPOINT: http://minio:9000
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER wajib diisi}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD wajib diisi}
    AWS_BUCKET: ${MINIO_BUCKET:-ztcms-media}
    AWS_URL: ${AWS_URL:-https://media.zultennis.my.id/ztcms-media}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    AWS_USE_PATH_STYLE_ENDPOINT: "true"

    MAIL_MAILER: ${MAIL_MAILER:-log}
    MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
    MAIL_PORT: ${MAIL_PORT:-2525}
    MAIL_USERNAME: ${MAIL_USERNAME:-null}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@zultennis.my.id}
    MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Zul Tennis Clinic Management System}

    SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-zultennis.my.id}
    SPA_URL: ${SPA_URL:-https://zultennis.my.id}

    PAYMENT_GATEWAY_WEBHOOK_SECRET: ${PAYMENT_GATEWAY_WEBHOOK_SECRET:?PAYMENT_GATEWAY_WEBHOOK_SECRET wajib diisi}

  volumes:
    - ./backend:/var/www/html
    - backend_vendor:/var/www/html/vendor
    - backend_storage:/var/www/html/storage
    - backend_bootstrap_cache:/var/www/html/bootstrap/cache

  networks:
    - ztcms

  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *backend-image

    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - nc -z 127.0.0.1 9000
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

    restart: unless-stopped

  nginx:
    <<: *dns
    image: nginx:1.27-alpine

    environment:
      TZ: ${TZ:-Asia/Makassar}

    volumes:
      - ./backend:/var/www/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      app:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1/health
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    networks:
      ztcms:
        aliases:
          - ztcms-api

    restart: unless-stopped

  queue:
    <<: *backend-image
    command:
      - php
      - artisan
      - queue:work
      - --tries=3
      - --backoff=5
      - --sleep=3
      - --timeout=120

    restart: unless-stopped

  scheduler:
    <<: *backend-image
    command:
      - php
      - artisan
      - schedule:work

    restart: unless-stopped

  mysql:
    <<: *dns
    image: mysql:8.0

    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ztcms}
      MYSQL_USER: ${DB_USERNAME:-ztcms}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi}
      TZ: ${TZ:-Asia/Makassar}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

    networks:
      - ztcms

    restart: unless-stopped

  redis:
    <<: *dns
    image: redis:7-alpine

    environment:
      TZ: ${TZ:-Asia/Makassar}

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5

    networks:
      - ztcms

    restart: unless-stopped

  minio:
    <<: *dns
    image: minio/minio:latest

    command:
      - server
      - /data
      - --console-address
      - :9001

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER wajib diisi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD wajib diisi}
      TZ: ${TZ:-Asia/Makassar}

    volumes:
      - minio_data:/data

    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - ztcms

    restart: unless-stopped

  frontend:
    <<: *dns

    build:
      context: ./frontend
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://zultennis.my.id}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/backend}

    environment:
      TZ: ${TZ:-Asia/Makassar}
       # Wajib agar Next.js dapat dijangkau Traefik.
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://zultennis.my.id}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/backend}

      # Gunakan alias unik agar tidak masuk ke container nginx project lain.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://ztcms-api/api/v1}

    depends_on:
      nginx:
        condition: service_healthy

    networks:
      - ztcms

    restart: unless-stopped

networks:
  ztcms:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  minio_data:
  backend_vendor:
  backend_storage:
  backend_bootstrap_cache: